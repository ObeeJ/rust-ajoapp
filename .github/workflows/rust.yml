name: CI

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

env:
  CARGO_TERM_COLOR: always
  JWT_SECRET: "ci-test-secret-that-is-long-enough-32bytes"
  PAYSTACK_SECRET_KEY: "sk_test_placeholder"
  CORS_ORIGIN: "http://localhost:8080"
  APP_URL: "http://localhost:3000"

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Install cargo-audit
        run: cargo install cargo-audit --quiet

      - name: Security audit
        run: cargo audit --deny warnings

      - name: Clippy (deny warnings)
        run: cargo clippy -p backend --all-targets -- -D warnings

      - name: Run tests
        run: cargo test -p backend --verbose

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install stable + wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('**/Cargo.lock') }}

      - name: Check frontend compiles to WASM
        run: cargo check -p frontend --target wasm32-unknown-unknown
        env:
          COWRI_API_BASE: "https://api.cowri.app/v1"
